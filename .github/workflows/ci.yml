name: CI
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: xcodegen generate
      - name: Core tests
        run: swift test --package-path Packages/FrontstageCore
      - name: Build macOS
        run: xcodebuild build -project Frontstage.xcodeproj -scheme Frontstage-macOS -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Build iPadOS
        run: xcodebuild build -project Frontstage.xcodeproj -scheme Frontstage-iOS -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - name: Pick iPad simulator
        id: sim
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)
          echo "iPhoneSimulator SDK: $SDK"
          PICK=$(xcrun simctl list devices available --json | jq -r --arg sdk "$SDK" '[.devices | to_entries[] | select(.key | endswith("iOS-" + $sdk)) | .key as $rt | .value[] | select(.name | startswith("iPad")) | "\(.udid) \($rt) \(.name)"][0] // empty')
          if [ -z "$PICK" ]; then echo "Kein iPad-Simulator für iOS-$SDK gefunden."; xcrun simctl list devices available; exit 1; fi
          UDID=${PICK%% *}
          echo "Gewählt: $PICK"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: App tests (iPad simulator)
        run: xcodebuild test -project Frontstage.xcodeproj -scheme Frontstage-iOS -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
