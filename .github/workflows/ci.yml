name: CI
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: xcodegen generate
      - name: Core tests
        run: swift test --package-path Packages/FrontstageCore
      - name: Build macOS
        id: mac
        continue-on-error: true
        run: xcodebuild build -project Frontstage.xcodeproj -scheme Frontstage-macOS -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO MSAL_CLIENT_ID="${{ secrets.MSAL_CLIENT_ID }}"
      - name: Pick iPad simulator
        id: sim
        run: |
          # Nur major.minor des SDK; Laufzeit-Schlüssel enden auf iOS-26-0 oder iOS-26-0-1 (Patch-Laufzeit)
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1-2 | tr . -)
          echo "iPhoneSimulator SDK: $SDK"
          DEVICES=$(xcrun simctl list devices available --json)
          PICK=$(echo "$DEVICES" | jq -r --arg sdk "$SDK" '[.devices | to_entries[] | select(.key | test("iOS-" + $sdk + "(-[0-9]+)*$")) | .key as $rt | .value[] | select(.name | startswith("iPad")) | "\(.udid) \($rt) \(.name)"][0] // empty')
          if [ -z "$PICK" ]; then
            # Rückfall: neueste iOS-Laufzeit mit iPad, Versionen numerisch sortiert
            PICK=$(echo "$DEVICES" | jq -r '[.devices | to_entries[] | select(.key | test("\\.iOS-[0-9-]+$")) | .key as $rt | ($rt | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $ver | .value[] | select(.name | startswith("iPad")) | {ver: $ver, line: "\(.udid) \($rt) \(.name)"}] | sort_by(.ver) | reverse | .[0].line // empty')
            if [ -n "$PICK" ]; then echo "Rückfall: keine Laufzeit für iOS-$SDK, nehme neueste verfügbare iOS-Laufzeit."; fi
          fi
          if [ -z "$PICK" ]; then echo "Kein iPad-Simulator gefunden (SDK iOS-$SDK)."; xcrun simctl list devices available; exit 1; fi
          UDID=${PICK%% *}
          echo "Gewählt: $PICK"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: App tests (iPad simulator)
        run: xcodebuild test -project Frontstage.xcodeproj -scheme Frontstage-iOS -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO MSAL_CLIENT_ID="${{ secrets.MSAL_CLIENT_ID }}"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
      - name: Fail if macOS build failed
        if: steps.mac.outcome == 'failure'
        run: |
          echo "macOS-Bau fehlgeschlagen"
          exit 1
