name: Frontstage
options:
  bundleIdPrefix: com.example
  developmentLanguage: de
  deploymentTarget: { iOS: "26.0", macOS: "26.0" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Frontstage
    PRODUCT_MODULE_NAME: Frontstage
    PRODUCT_BUNDLE_IDENTIFIER: com.example.frontstage
    MSAL_CLIENT_ID: ""  # Microsoft-App-Kennung; echte Kennung per CI-Secret oder lokal, nie im Repo
packages:
  FrontstageCore: { path: Packages/FrontstageCore }
  MSAL: { url: https://github.com/AzureAD/microsoft-authentication-library-for-objc, majorVersion: 2.0.0 }
targets:
  Frontstage-iOS:
    type: application
    platform: iOS
    sources: [Frontstage]
    dependencies: [{ package: FrontstageCore }, { package: MSAL }]
    settings:
      base:
        CLOUDKIT_CONTAINER_ID: iCloud.com.example.frontstage  # Platzhalter; echte Kennung per CI-Secret
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    entitlements:
      path: Config/Frontstage-iOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER_ID)]
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)]
    info:
      path: Config/Frontstage-iOS-Info.plist
      properties:
        # XcodeGen schreibt sonst feste Werte 1.0 (1) in die Datei, die MARKETING_VERSION und
        # CURRENT_PROJECT_VERSION überdecken (TestFlight-Build-Nummer, Teilplan 04).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FrontstageCloudKitContainer: $(CLOUDKIT_CONTAINER_ID)
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [frontstage.timetable-source.morning-refresh]
        MSALClientID: $(MSAL_CLIENT_ID)
        NSCameraUsageDescription: "Die Kamera nimmt Bilder für die Tafel auf und liest den Code zum Koppeln von Geräten."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [msauth.$(PRODUCT_BUNDLE_IDENTIFIER)]
        LSApplicationQueriesSchemes: [msauthv2, msauthv3, ms-powerpoint, ms-word, ms-excel]
    scheme: { testTargets: [FrontstageTests] }
  Frontstage-macOS:
    type: application
    platform: macOS
    sources: [Frontstage]
    dependencies: [{ package: FrontstageCore }, { package: MSAL }]
    settings:
      base:
        CLOUDKIT_CONTAINER_ID: iCloud.com.example.frontstage  # Platzhalter; echte Kennung per CI-Secret
    entitlements:
      path: Config/Frontstage-macOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER_ID)]
        com.apple.developer.aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true  # Notizen neben dem Dokument (ADR-0011), Datenordner (ADR-0010)
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true  # QR-Code beim Koppeln scannen (FR-14.1)
        # Am Mac verlangt dieses Entitlement ein Provisioning-Profil: unsigniert in CI egal, ein lokal
        # signierter Build ohne Profil startet nicht (Geräte-Checkliste Teilplan 03).
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)]
    info:
      path: Config/Frontstage-macOS-Info.plist
      properties:
        # Siehe Frontstage-iOS: Versionsschlüssel aus den Build-Einstellungen übernehmen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FrontstageCloudKitContainer: $(CLOUDKIT_CONTAINER_ID)
        MSALClientID: $(MSAL_CLIENT_ID)
        NSCameraUsageDescription: "Die Kamera nimmt Bilder für die Tafel auf und liest den Code zum Koppeln von Geräten."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [msauth.$(PRODUCT_BUNDLE_IDENTIFIER)]
    scheme: {}
  FrontstageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FrontstageTests]
    dependencies: [{ target: Frontstage-iOS }]
    settings:
      base:
        PRODUCT_NAME: FrontstageTests
        PRODUCT_MODULE_NAME: FrontstageTests
        PRODUCT_BUNDLE_IDENTIFIER: com.example.frontstage.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Frontstage.app/Frontstage"
        BUNDLE_LOADER: "$(TEST_HOST)"
